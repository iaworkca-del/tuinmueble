<!-- Modal: Planes y Suscripciones de la plataforma (Orinokiagente) -->
<style>
  .planes-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(10,20,30,0.6); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .planes-overlay.open { display: flex; }
  .planes-modal {
    background: #fff; border-radius: 24px; max-width: 1180px; width: 100%;
    max-height: 90vh; overflow-y: auto; padding: 44px; position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,0.35);
  }
  .planes-cerrar {
    position: absolute; top: 18px; right: 18px; width: 36px; height: 36px;
    border-radius: 50%; border: 1px solid #e5e5e5; background: #fff;
    font-size: 16px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; color: #666;
  }
  .planes-cerrar:hover { color: #111; }
  .planes-head { text-align: center; margin-bottom: 34px; }
  .planes-head h2 { font-size: clamp(22px, 3.5vw, 28px); font-weight: 800; margin: 0 0 8px; color: var(--pub-primario); }
  .planes-head p { color: #666; font-size: 15px; margin: 0; }
  .planes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; align-items: start; }
  .plan-card { border-radius: 18px; padding: 30px 26px; background: #f6f7f5; border: 1px solid #e9e9e6; }
  .plan-card.destacado {
    background: linear-gradient(#fff, #fff) padding-box,
                linear-gradient(135deg, var(--pub-primario), var(--pub-secundario)) border-box;
    border: 2px solid transparent;
    box-shadow: 0 18px 44px rgba(0,0,0,0.14);
  }
  .plan-nombre { font-size: 19px; font-weight: 800; color: #1a1a1a; margin-bottom: 6px; }
  .plan-tagline { color: #666; font-size: 13px; margin-bottom: 18px; min-height: 34px; }
  .plan-precio { font-size: 30px; font-weight: 800; color: var(--pub-primario); }
  .plan-precio-periodo { color: #888; font-size: 12.5px; display: block; margin-bottom: 20px; }
  .plan-cta {
    display: block; text-align: center; padding: 13px 18px; border-radius: 30px;
    font-weight: 700; font-size: 14px; text-decoration: none; margin-bottom: 24px;
    background: #fff; color: var(--pub-primario); border: 2px solid var(--pub-primario);
    transition: transform .15s;
  }
  .plan-cta:hover { transform: translateY(-2px); }
  .plan-card.destacado .plan-cta {
    background: linear-gradient(135deg, var(--pub-primario), var(--pub-secundario)); color: #fff; border: none;
  }
  .plan-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .plan-lista li { font-size: 13px; color: #333; display: flex; gap: 9px; align-items: flex-start; line-height: 1.4; }
  .plan-check {
    flex-shrink: 0; width: 17px; height: 17px; border-radius: 50%; background: var(--pub-primario);
    color: #fff; font-size: 9px; font-weight: 800; display: flex; align-items: center;
    justify-content: center; margin-top: 1px;
  }
  .plan-card.destacado .plan-check { background: linear-gradient(135deg, var(--pub-primario), var(--pub-secundario)); }
  @media (max-width: 980px) { .planes-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 780px) { .planes-grid { grid-template-columns: 1fr; } .planes-modal { padding: 28px 18px; } }
</style>

<div class="planes-overlay" id="planesOverlay">
  <div class="planes-modal">
    <button class="planes-cerrar" id="planesCerrar" aria-label="Cerrar">✕</button>
    <div class="planes-head">
      <h2>Planes y Suscripciones — Orinokiagente</h2>
      <p>Elige el plan que mejor se adapta a tu inmobiliaria.</p>
    </div>
    <div class="planes-grid" id="planesGrid"></div>
  </div>
</div>

<script>
  let PLANES_ORINOKIAGENTE = [
    {
      nombre: 'Básico',
      tagline: 'Para inmobiliarias que están empezando',
      precio: 'USD$ 20',
      destacado: false,
      items: [
        '🏠 1 Landing Page de la agencia', 'Hasta 20 propiedades publicadas', '🙋🏽 1 agente',
        '🤖 Generador de descripciones con IA', '📋 Panel de administración de propiedades',
        '📸 Galería de fotos por propiedad', '🔗 Enlace público de la agencia',
        '✍🏼 Recibe consultas directo por WhatsApp',
      ],
    },
    {
      nombre: 'VIP',
      tagline: 'Para agencias que quieren crecer 🔥',
      precio: 'USD$ 35',
      destacado: false,
      items: [
        '🏠 1 Landing Page de la agencia', 'Propiedades ilimitadas', '🙋🏽 Hasta 5 agentes',
        '🤖 Generador de descripciones con IA (avanzado)', '📋 Panel de administración de propiedades',
        '📸 Galería de fotos y videos por propiedad', '🔗 Enlace público de la agencia',
        '✍🏼 Recibe consultas directo por WhatsApp', '📊 Estadísticas de visitas por propiedad',
        '👥 Registro de clientes interesados',
      ],
    },
    {
      nombre: 'Plus',
      tagline: 'Para inmobiliarias que quieren automatizar todo 🚀',
      precio: 'USD$ 45',
      destacado: true,
      items: [
        '🏠 1 Landing Page de la agencia', 'Propiedades ilimitadas', '🙋🏽 Hasta 5 agentes',
        '🤖 Generador de descripciones con IA (avanzado)', '📋 Panel de administración de propiedades',
        '📸 Galería de fotos y videos por propiedad', '🔗 Enlace público de la agencia',
        '✍🏼 Recibe consultas directo por WhatsApp', '📊 Estadísticas de visitas por propiedad',
        '👥 Registro de clientes interesados', '🤖 Generador de Contenido para Redes Sociales y WhatsApp',
      ],
    },
  ];

  function renderizarPlanesAgente() {
    const grid = document.getElementById('planesGrid');
    if (!grid) return;
    grid.innerHTML = PLANES_ORINOKIAGENTE.map(plan => `
      <div class="plan-card${plan.destacado ? ' destacado' : ''}">
        <div class="plan-nombre">${plan.nombre}</div>
        <div class="plan-tagline">${plan.tagline}</div>
        <div class="plan-precio">${plan.precio}</div>
        <span class="plan-precio-periodo">Mensual</span>
        <a href="https://wa.me/584148960164?text=${encodeURIComponent('Hola! Quiero suscribirme al plan ' + plan.nombre + ' de Orinokiagente')}"
           target="_blank" rel="noopener" class="plan-cta">Quiero este plan</a>
        <ul class="plan-lista">
          ${plan.items.map(i => `<li><span class="plan-check">✓</span>${i}</li>`).join('')}
        </ul>
      </div>
    `).join('');
  }

  let planesAgenteCargados = false;

  async function abrirPlanesAgente(e) {
    if (e) e.preventDefault();
    document.getElementById('planesOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
    if (!planesAgenteCargados) {
      try {
        const resp = await fetch('/api/planes-publicos');
        const data = await resp.json();
        if (data.success && Array.isArray(data.planes) && data.planes.length) {
          PLANES_ORINOKIAGENTE = data.planes;
        }
      } catch (err) {
        console.warn('No se pudieron cargar los planes desde el servidor, se muestran los de por defecto.', err);
      }
      planesAgenteCargados = true;
    }
    renderizarPlanesAgente();
  }
  function cerrarPlanesAgente() {
    document.getElementById('planesOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }
  document.getElementById('planesCerrar').addEventListener('click', cerrarPlanesAgente);
  document.getElementById('planesOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'planesOverlay') cerrarPlanesAgente();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') cerrarPlanesAgente();
  });
</script>
